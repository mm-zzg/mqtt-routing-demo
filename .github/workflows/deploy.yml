name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
      TF_VAR_base_domain: ${{ vars.BASE_DOMAIN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || '' }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_image_tag: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        run: terraform -chdir=infra init

      - name: Import existing bootstrap resources
        run: |
          RG="${TF_VAR_resource_group_name}"
          SUB="${AZURE_SUBSCRIPTION_ID}"
          PREFIX="${TF_VAR_name_prefix:-mqtt-routing}"

          import_if_exists() {
            local type=$1 name=$2 id=$3
            if az resource show --ids "$id" --output none 2>/dev/null; then
              echo "Importing $type.$name ..."
              terraform -chdir=infra import "$type.$name" "$id" || true
            else
              echo "$type.$name does not exist, will be created."
            fi
          }

          import_if_exists azurerm_log_analytics_workspace.this \
            "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.OperationalInsights/workspaces/${PREFIX}-law"

          import_if_exists azurerm_container_app_environment.this \
            "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.App/managedEnvironments/${PREFIX}-aca"

          # Discover ACR name from the resource group (only one expected)
          ACR_NAME=$(az acr list -g "$RG" --query '[0].name' -o tsv 2>/dev/null || true)
          if [ -n "$ACR_NAME" ] && [ "$ACR_NAME" != "None" ]; then
            import_if_exists azurerm_container_registry.this \
              "/subscriptions/$SUB/resourceGroups/$RG/providers/Microsoft.ContainerRegistry/registries/$ACR_NAME"
          else
            echo "azurerm_container_registry.this does not exist, will be created."
          fi
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform bootstrap
        run: terraform -chdir=infra apply -auto-approve -target=azurerm_log_analytics_workspace.this -target=azurerm_container_app_environment.this -target=azurerm_container_registry.this

      - name: Build and push tenant plane image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          az acr login --name "${ACR%%.*}"
          docker build -f Dockerfile.tenant-plane -t "$ACR/tenant-plane:${GITHUB_SHA}" .
          docker push "$ACR/tenant-plane:${GITHUB_SHA}"

      - name: Build and push mqtt gateway image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          docker build -f Dockerfile.mqtt-gateway -t "$ACR/mqtt-gateway:${GITHUB_SHA}" .
          docker push "$ACR/mqtt-gateway:${GITHUB_SHA}"

      - name: Build and push ingress image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          az acr login --name "${ACR%%.*}"
          docker build -f Dockerfile.ingress -t "$ACR/ingress:${GITHUB_SHA}" .
          docker push "$ACR/ingress:${GITHUB_SHA}"

      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve
