name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    env:
      TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
      TF_VAR_base_domain: ${{ vars.BASE_DOMAIN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID || '' }}
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '' }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION || 'eastus' }}
      TF_VAR_image_tag: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Ensure Terraform state backend
        run: |
          RG="${TF_VAR_resource_group_name}"
          SUB=$(az account show --query id -o tsv)
          SA="mqtttf${SUB:0:8}"

          az group create --name "$RG" --location "${TF_VAR_location}" --output none 2>/dev/null || true

          # Check if SA exists anywhere in the subscription first
          EXISTING_RG=$(az storage account list --query "[?name=='$SA'].resourceGroup" -o tsv 2>/dev/null || true)

          if [ -n "$EXISTING_RG" ]; then
            echo "Storage account '$SA' already exists in resource group '$EXISTING_RG'. Reusing it."
            SA_RG="$EXISTING_RG"
          else
            echo "Creating storage account '$SA' in resource group '$RG' ..."
            az storage account create \
              --name "$SA" \
              --resource-group "$RG" \
              --location "${TF_VAR_location}" \
              --sku Standard_LRS \
              --min-tls-version TLS1_2 \
              --allow-blob-public-access false \
              --output none
            SA_RG="$RG"
          fi

          if ! az storage container exists --name tfstate --account-name "$SA" --auth-mode login --query exists -o tsv 2>/dev/null | grep -q true; then
            az storage container create --name tfstate --account-name "$SA" --auth-mode login --output none 2>/dev/null \
              || az storage container create --name tfstate --account-name "$SA" --output none
          fi

          echo "TF_STATE_RG=$SA_RG" >> "$GITHUB_ENV"
          echo "TF_STATE_SA=$SA" >> "$GITHUB_ENV"

      - name: Terraform init
        run: |
          terraform -chdir=infra init \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=$TF_STATE_SA"

      - name: Terraform bootstrap
        run: terraform -chdir=infra apply -auto-approve -target=azurerm_log_analytics_workspace.this -target=azurerm_container_app_environment.this -target=azurerm_container_registry.this

      - name: Build and push tenant plane image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          az acr login --name "${ACR%%.*}"
          docker build -f Dockerfile.tenant-plane -t "$ACR/tenant-plane:${GITHUB_SHA}" .
          docker push "$ACR/tenant-plane:${GITHUB_SHA}"

      - name: Build and push mqtt gateway image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          docker build -f Dockerfile.mqtt-gateway -t "$ACR/mqtt-gateway:${GITHUB_SHA}" .
          docker push "$ACR/mqtt-gateway:${GITHUB_SHA}"

      - name: Build and push ingress image
        run: |
          ACR=$(terraform -chdir=infra output -raw container_registry_login_server)
          az acr login --name "${ACR%%.*}"
          docker build -f Dockerfile.ingress -t "$ACR/ingress:${GITHUB_SHA}" .
          docker push "$ACR/ingress:${GITHUB_SHA}"

      - name: Terraform apply
        run: terraform -chdir=infra apply -auto-approve
